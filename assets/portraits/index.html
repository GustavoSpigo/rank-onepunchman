<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Retratos · Hero Atlas</title><style>body{background:#090e14;color:#e5eaf0;font:14px system-ui;margin:24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-weight:400;font-size:25px}a{color:#f5bf69}button{background:#172231;border:1px solid #536174;color:white;padding:9px 16px;cursor:pointer}button:disabled{opacity:.3}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:20px}figure{margin:0;background:#0e1722}img{display:block;width:100%;height:250px;object-fit:contain}figcaption{padding:10px;font-size:12px}p{color:#8e9dad;font-size:11px}@media(max-width:600px){main{grid-template-columns:repeat(2,minmax(0,1fr))}img{height:210px}}</style><header><div><h1>Retratos do Hero Atlas</h1><p>Ilustrações de fãs criadas com IA · <a href="../../">Voltar ao site</a></p></div><nav><button id="prev">←</button> <span id="count"></span> <button id="next">→</button></nav></header><main id="gallery"></main><script>let portraits=[],page=0;const size=8;function render(){document.querySelector('#count').textContent=`${page+1} / ${Math.max(1,Math.ceil(portraits.length/size))}`;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=(page+1)*size>=portraits.length;const g=document.querySelector('#gallery');g.replaceChildren();for(const p of portraits.slice(page*size,(page+1)*size)){const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');i.src=p.file;i.alt=p.name;c.textContent=p.name;f.append(i,c);g.append(f)}}document.querySelector('#prev').onclick=()=>{page--;render()};document.querySelector('#next').onclick=()=>{page++;render()};fetch('catalog.json').then(r=>r.json()).then(d=>{portraits=d;render()});</script></html>
